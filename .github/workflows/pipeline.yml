name: Employee Attrition MLOps CI/CD

on:
  push:
    branches:
      - main

  schedule:
    - cron: "0 */6 * * *"

  workflow_dispatch:
    inputs:
      retrain:
        description: "Force model retraining"
        required: false
        default: false
        type: boolean

jobs:
  mlops-pipeline:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Python
      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Tests
      - name: Run Tests
        run: |
          python -m compileall src monitoring

      # 5. Start MLflow
      - name: Start MLflow
        run: |
          docker compose up -d mlflow
          sleep 15

      # 6. Data Pipeline
      - name: Run Data Pipeline
        run: |
          python src/preprocessing.py

      # 7. Feature Pipeline
      - name: Run Feature Engineering
        run: |
          python src/feature_engineering.py

      # 8. Train Model
      - name: Train Model
        run: |
          python src/train.py

      # 9. Evaluate Model
      - name: Evaluate Model
        run: |
          python src/evaluate.py

          echo "===== EVALUATION DIRECTORY ====="
          ls -la evaluation

          echo "===== CHAMPION MODEL ====="
          cat evaluation/champion_model.json
          
      # 10. Build Docker Image
      - name: Build Docker Image
        run: |
          docker build -t employee-attrition-api .

      # 11. Deploy
      - name: Deploy Application
        run: |
          docker compose up -d --build api
          docker compose ps
          docker compose logs api

      # 12. Monitor
      - name: Check API Health
        run: |
          for i in {1..12}; do
            if curl --fail http://localhost:8000/health; then
              echo "API is healthy"
              exit 0
            fi

            echo "Waiting for API..."
            sleep 5
          done

          echo "API failed to become healthy"
          docker compose ps -a
          docker compose logs api
          exit 1

      # 13. Data Drift Check
      - name: Check Data Drift
        run: |
          python monitoring/drift_check.py

      # 14. Performance Check
      - name: Check Model Performance
        run: |
          python monitoring/performance_check.py

      # 15. Automatic Retraining/Manual Retraining
      - name: Automatic Retraining
        id: retraining
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.retrain }}" = "true" ]; then
            echo "Manual retraining requested."
            python -m src.retrain
            echo "retraining_triggered=true" >> "$GITHUB_OUTPUT"
          else
            python monitoring/retrain_trigger.py
          fi

      # 16. Redeploy Retrained Model
      - name: Redeploy After Retraining
        if: steps.retraining.outputs.retraining_triggered == 'true'
        run: |
          docker compose up -d --build api
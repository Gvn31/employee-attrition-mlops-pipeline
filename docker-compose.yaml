version: "3.9"

services:

  mlflow:
    image: python:3.12
    container_name: mlflow-server
    working_dir: /app
    volumes:
      - .:/app
    command: >
      bash -c "
      pip install -r requirements.txt &&
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:///mlflow.db
      --default-artifact-root ./mlruns
      "
    ports:
      - "5000:5000"

  api:
    build: .
    container_name: employee-api
    depends_on:
      - mlflow
    ports:
      - "8000:8000"
    volumes:
      - .:/app
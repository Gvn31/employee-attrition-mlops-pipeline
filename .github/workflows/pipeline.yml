name: Employee Attrition MLOps CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "monitoring/**"
      - "feature_repo/**"
      - "data/**"
      - "dvc.yaml"
      - "dvc.lock"
      - "Dockerfile"
      - "docker-compose.yaml"
      - "prometheus.yaml"
      - "requirements.txt"
      - ".github/workflows/pipeline.yml"

  schedule:
    - cron: "0 */6 * * *"

  workflow_dispatch:
    inputs:
      retrain:
        description: "Force model retraining"
        required: false
        default: false
        type: boolean

jobs:
  mlops-pipeline:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Python
      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Configure AWS Credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      # Install DVC S3 Support
      - name: Install DVC S3
        run: |
          pip install "dvc[s3]"

      # Configure DVC Remote
      - name: Configure DVC Remote
        run: |
          dvc remote add -d storage s3://employee-attrition-dvc-storage


      # Pull Dataset From S3
      - name: Pull DVC Data
        run: |
          dvc pull


      # 4. Verify Raw Data
      - name: Verify Raw Data
        run: |
          echo "===== RAW DATA ====="
          ls -lh data/raw

          test -f data/raw/emp_attrition_csv.csv

          echo "Raw dataset available."

      # 5. Tests
      - name: Run Tests
        run: |
          python -m compileall src monitoring

      # 6. Start MLflow
      - name: Start MLflow
        run: |
          docker compose up -d mlflow
          sleep 15

      # 7. Data Pipeline
      - name: Run Data Pipeline
        run: |
          python src/preprocessing.py

      # 7.1 Verify Processed Data
      - name: Verify Processed Data
        run: |
          echo "===== PROCESSED DATA ====="
          ls -lh data/processed

          test -f data/processed/emp_attrition_cleaned.csv

          echo "Cleaned dataset created successfully."

      # 8. Feature Pipeline
      - name: Run Feature Engineering
        run: |
          python src/feature_engineering.py

      # 8.1 Verify Feature Dataset
      - name: Verify Feature Dataset
        run: |
          echo "===== FEATURE DATA ====="
          ls -lh data/processed

          test -f data/processed/emp_attrition_features.parquet

          echo "Feature dataset created successfully."

      # 8.2 Apply Feast Feature Store
      - name: Apply Feast Feature Store
        run: |
          cd feature_repo/feature_repo
          feast apply

      # 9. Train Model
      - name: Train Model
        run: |
          python src/train.py

      # 10. Verify Trained Models
      - name: Verify Trained Models
        run: |
          echo "===== MODEL FILES ====="
          ls -lh models

          test -f models/logistic_regression.pkl
          test -f models/decision_tree.pkl
          test -f models/random_forest.pkl
          test -f models/xgboost.pkl
          test -f models/scaler.pkl
          test -f models/feature_columns.pkl

          echo "All trained model files exist."

      # 11. Evaluate Model
      - name: Evaluate Model
        run: |
          python src/evaluate.py

          echo "===== EVALUATION DIRECTORY ====="
          ls -la evaluation

          echo "===== CHAMPION MODEL ====="
          cat evaluation/champion_model.json

      
  # 12. Login to Amazon ECR
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

  # 13. Build and Push Docker Image
      - name: Build and Push Docker Image
        env:
          ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-south-1.amazonaws.com
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:v1 .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:v1

  # 14. Data Drift Check
      - name: Check Data Drift
        run: |
          python monitoring/drift_check.py

  # 15. Performance Check
      - name: Check Model Performance
        run: |
          python monitoring/performance_check.py

  # 16. Automatic / Manual Retraining
      - name: Automatic Retraining
        id: retraining
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.retrain }}" = "true" ]; then
            echo "Manual retraining requested."

            python -m src.retrain

            echo "retraining_triggered=true" >> "$GITHUB_OUTPUT"
          else
              python monitoring/retrain_trigger.py
            fi

  # 17. Deploy to EC2
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 901099689002.dkr.ecr.ap-south-1.amazonaws.com

            docker pull 901099689002.dkr.ecr.ap-south-1.amazonaws.com/employee-attrition-mlops:v1

            cd ~/employee-attrition-mlops-pipeline

            docker compose down
            docker compose up -d

            docker ps

 # 18. Verify Deployment
      - name: Verify EC2 API Health
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            for i in {1..12}; do
              if curl --fail http://localhost:8000/health; then
                echo "API is healthy"
                exit 0
              fi

              echo "Waiting for API..."
              sleep 5
            done

            echo "API failed health check"
            docker ps
            docker compose logs api
            exit 1